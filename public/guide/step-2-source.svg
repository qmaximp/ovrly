<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="Segoe UI, Inter, Arial, sans-serif" role="img" aria-label="Окно OBS: кнопка плюс в источниках и пункт Браузер">
  <defs>
    <linearGradient id="teal2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <rect width="720" height="420" fill="#0b1220"/>
  <circle cx="660" cy="20" r="180" fill="#5eead4" opacity=".05"/>

  <!-- окно OBS -->
  <rect x="20" y="20" width="680" height="380" rx="14" fill="#0c1522" stroke="#223449"/>
  <path d="M20 58h680" stroke="#223449"/>
  <circle cx="40" cy="39" r="4" fill="#f87171"/>
  <circle cx="54" cy="39" r="4" fill="#fbbf24"/>
  <circle cx="68" cy="39" r="4" fill="#34d399"/>
  <text x="360" y="43" font-size="10.5" fill="#8fa3b8" text-anchor="middle">OBS Studio — Профиль: стрим</text>
  <text x="40" y="72" font-size="9" fill="#7f93a8">Файл</text>
  <text x="76" y="72" font-size="9" fill="#7f93a8">Правка</text>
  <text x="120" y="72" font-size="9" fill="#7f93a8">Вид</text>
  <text x="152" y="72" font-size="9" fill="#7f93a8">Профиль</text>
  <text x="206" y="72" font-size="9" fill="#7f93a8">Сцена</text>

  <!-- сцены -->
  <rect x="20" y="82" width="188" height="148" rx="8" fill="#0a111b" stroke="#1c2b3b"/>
  <text x="34" y="101" font-size="8.5" letter-spacing="1.6" fill="#7f93a8">СЦЕНЫ</text>
  <rect x="32" y="110" width="164" height="30" rx="6" fill="#0f2b2a" stroke="#5eead4" stroke-opacity=".5"/>
  <text x="44" y="129" font-size="10" fill="#dbe9e6">Главная</text>
  <rect x="32" y="146" width="164" height="28" rx="6" fill="#0d1826"/>
  <text x="44" y="164" font-size="10" fill="#8fa3b8">Начало стрима</text>
  <rect x="32" y="180" width="164" height="28" rx="6" fill="#0d1826"/>
  <text x="44" y="198" font-size="10" fill="#8fa3b8">Перерыв</text>

  <!-- источники -->
  <rect x="20" y="238" width="188" height="162" rx="8" fill="#0a111b" stroke="#1c2b3b"/>
  <text x="34" y="257" font-size="8.5" letter-spacing="1.6" fill="#7f93a8">ИСТОЧНИКИ</text>
  <!-- кнопка плюс -->
  <rect x="164" y="245" width="26" height="22" rx="6" fill="url(#teal2)"/>
  <path d="M177 251v10M172 256h10" stroke="#04110f" stroke-width="2" stroke-linecap="round"/>
  <rect x="161" y="242" width="32" height="28" rx="8" fill="none" stroke="#5eead4" stroke-opacity=".45"/>

  <!-- выпадающее меню -->
  <rect x="104" y="106" width="178" height="128" rx="8" fill="#101c2b" stroke="#2b4055"/>
  <text x="118" y="124" font-size="8" letter-spacing="1.4" fill="#7f93a8">ДОБАВИТЬ</text>
  <rect x="112" y="131" width="162" height="26" rx="5" fill="#0f2b2a"/>
  <text x="124" y="148" font-size="10" font-weight="600" fill="#5eead4">Браузер</text>
  <text x="124" y="175" font-size="10" fill="#a9bcc9">Окно</text>
  <text x="124" y="199" font-size="10" fill="#a9bcc9">Видеоустройство</text>
  <text x="124" y="223" font-size="10" fill="#a9bcc9">Источник звука</text>

  <!-- превью -->
  <rect x="220" y="82" width="464" height="318" rx="8" fill="#070b12" stroke="#1c2b3b"/>
  <rect x="220" y="82" width="464" height="22" rx="8" fill="#0d1826"/>
  <text x="234" y="97" font-size="8.5" letter-spacing="1.4" fill="#7f93a8">ПРЕДПРОСМОТР</text>
  <rect x="300" y="150" width="304" height="171" rx="6" fill="#0b1522" stroke="#1c2b3b" stroke-dasharray="4 4"/>
  <text x="452" y="239" font-size="10" fill="#44586b" text-anchor="middle">сцена без оверлея</text>

  <!-- список источников -->
  <rect x="32" y="276" width="164" height="28" rx="6" fill="#0d1826" stroke="#1c2b3b"/>
  <circle cx="44" cy="290" r="3" fill="#5eead4"/>
  <text x="54" y="294" font-size="9.5" fill="#8fa3b8">Оверлей</text>
  <rect x="32" y="310" width="164" height="28" rx="6" fill="#0d1826"/>
  <text x="44" y="328" font-size="9.5" fill="#8fa3b8">Веб-камера</text>
  <rect x="32" y="344" width="164" height="28" rx="6" fill="#0d1826"/>
  <text x="44" y="362" font-size="9.5" fill="#8fa3b8">Микрофон</text>

  <!-- номер шага -->
  <circle cx="668" cy="88" r="15" fill="url(#teal2)"/>
  <text x="668" y="93" font-size="13" font-weight="700" fill="#04110f" text-anchor="middle">2</text>
</svg>
