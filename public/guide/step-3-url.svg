  <rect x="132" y="300" width="16" height="16" rx="4" fill="#0f766e" stroke="#5eead4" stroke-opacity=".6"/>
  <path d="M136 308l3 3 5-6" stroke="#eefaf8" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="158" y="312" font-size="9.5" fill="#a9bcc9">Управление аудио через OBS</text>

  <!-- кнопки -->
  <rect x="392" y="330" width="86" height="34" rx="8" fill="#132234" stroke="#2b4055"/>
  <text x="435" y="351" font-size="10" fill="#a9bcc9" text-anchor="middle">Отмена</text>
