  <path d="M108 72h504" stroke="#2b4055"/>
  <text x="132" y="70" font-size="12.5" font-weight="600" fill="#eefaf8">Свойства — Браузер</text>
  <text x="586" y="70" font-size="12" fill="#7f93a8" text-anchor="middle">✕</text>

  <text x="132" y="116" font-size="9.5" fill="#8fa3b8">URL</text>
  <rect x="132" y="124" width="456" height="34" rx="8" fill="#0a111b" stroke="#5eead4" stroke-opacity=".5"/>
  <text x="146" y="146" font-size="10" fill="#dbe9e6" font-family="Consolas, monospace">ovrly.ru/overlay?room=…</text>
  <path d="M414 132v18" stroke="#5eead4" stroke-width="1.4"/>

  <text x="132" y="190" font-size="9.5" fill="#8fa3b8">Ширина</text>
  <rect x="132" y="198" width="120" height="32" rx="8" fill="#0a111b" stroke="#1c2b3b"/>
  <text x="192" y="219" font-size="11" fill="#dbe9e6" text-anchor="middle" font-family="Consolas, monospace">1920</text>

  <text x="274" y="190" font-size="9.5" fill="#8fa3b8">Высота</text>
  <rect x="274" y="198" width="120" height="32" rx="8" fill="#0a111b" stroke="#1c2b3b"/>
  <text x="334" y="219" font-size="11" fill="#dbe9e6" text-anchor="middle" font-family="Consolas, monospace">1080</text>

  <rect x="410" y="198" width="178" height="32" rx="8" fill="#0f2b2a" stroke="#5eead4" stroke-opacity=".35"/>
  <text x="499" y="218" font-size="9.5" fill="#5eead4" text-anchor="middle">можно поставить любой</text>

  <!-- чекбоксы -->
  <rect x="132" y="252" width="16" height="16" rx="4" fill="#0f766e" stroke="#5eead4" stroke-opacity=".6"/>
  <path d="M136 260l3 3 5-6" stroke="#eefaf8" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="158" y="264" font-size="9.5" fill="#a9bcc9">Обновить браузер, когда сцена становится активной</text>

  <rect x="132" y="280" width="16" height="16" rx="4" fill="#0a111b" stroke="#2b4055"/>
