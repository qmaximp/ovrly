<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="Segoe UI, Inter, Arial, sans-serif" role="img" aria-label="Свойства Browser Source: поле URL, размер и кнопка ОК">
  <defs>
    <linearGradient id="teal3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <rect width="720" height="420" fill="#0b1220"/>
  <circle cx="640" cy="30" r="190" fill="#5eead4" opacity=".05"/>

  <!-- фон OBS -->
  <rect x="20" y="20" width="680" height="380" rx="14" fill="#0c1522" stroke="#223449"/>
  <path d="M20 58h680" stroke="#223449"/>
  <circle cx="40" cy="39" r="4" fill="#f87171"/>
  <circle cx="54" cy="39" r="4" fill="#fbbf24"/>
  <circle cx="68" cy="39" r="4" fill="#34d399"/>
