<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="Segoe UI, Inter, Arial, sans-serif" role="img" aria-label="Карточка оверлея в кабинете с кнопкой Копировать">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0e1b2b"/>
    </linearGradient>
    <linearGradient id="teal1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="glow1" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="720" height="420" fill="url(#bg1)"/>
  <circle cx="650" cy="30" r="190" fill="#5eead4" opacity=".05"/>
  <circle cx="30" cy="410" r="160" fill="#f97316" opacity=".04"/>

  <!-- окно браузера -->
  <rect x="24" y="24" width="672" height="372" rx="18" fill="#0c1522" stroke="#223449"/>
  <path d="M24 68h672" stroke="#223449"/>
  <circle cx="48" cy="46" r="4" fill="#f87171"/>
  <circle cx="62" cy="46" r="4" fill="#fbbf24"/>
  <circle cx="76" cy="46" r="4" fill="#34d399"/>
  <rect x="94" y="35" width="298" height="22" rx="11" fill="#0a111b" stroke="#1c2b3b"/>
  <text x="108" y="50" font-size="11" fill="#8fa3b8">ovrly.ru/cabinet</text>

